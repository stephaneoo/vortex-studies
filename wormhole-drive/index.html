<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wormhole Drive</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Major+Mono+Display&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: the wormhole fills the screen; a camera-console panel docks right on desktop and becomes a bottom sheet on phones */
:root{
  --void:#050407;
  --panel:rgba(13,11,9,.84);
  --fg:#f1ebdf;
  --dim:#9a917f;
  --amber:#8fc4ff;
  --line:rgba(241,235,223,.13);
  --font-display:"Major Mono Display",ui-monospace,monospace;
  --font-ui:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--void);color:var(--fg);font-family:var(--font-ui);font-size:12px;overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:move}
.top{position:fixed;top:0;left:0;right:0;z-index:3;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;pointer-events:none;
  padding-top:max(14px,env(safe-area-inset-top,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top>*{pointer-events:auto}
.brand{display:flex;flex-direction:column;gap:4px}
.brand h1{margin:0;font-family:var(--font-display);font-weight:400;font-size:clamp(14px,1.6vw,17px);letter-spacing:.02em;line-height:1;white-space:nowrap}
.brand p{margin:0;color:var(--dim);font-size:11px;max-width:40ch;line-height:1.5}
.tools{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
button,.filebtn{font:inherit;color:var(--fg);background:var(--panel);border:1px solid var(--line);height:30px;padding:0 11px;border-radius:2px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
button:hover,.filebtn:hover{border-color:rgba(143,196,255,.5)}
button:focus-visible,.filebtn:focus-within,input:focus-visible,select:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
button.on{border-color:var(--amber);color:var(--amber)}
.lamp{width:7px;height:7px;border-radius:50%;background:#3a332a;box-shadow:inset 0 0 0 1px #000}
button.on .lamp{background:var(--amber);box-shadow:0 0 8px var(--amber)}
.filebtn input{position:absolute;opacity:0;width:1px;height:1px}
aside{position:fixed;right:0;top:0;bottom:0;width:300px;background:var(--panel);border-left:1px solid var(--line);backdrop-filter:blur(10px);overflow-y:auto;
  padding-top:max(70px,calc(env(safe-area-inset-top,0px) + 62px));padding-bottom:max(16px,env(safe-area-inset-bottom,0px));padding-left:16px;padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:18px;transition:transform .25s ease}
aside.closed{transform:translateX(105%)}
.grp{display:flex;flex-direction:column;gap:9px}
.grp h2{margin:0;font-size:10px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--amber);display:flex;justify-content:space-between;align-items:center}
.ctl{display:grid;grid-template-columns:78px minmax(0,1fr) 42px;align-items:center;gap:8px}
.ctl label{color:var(--dim);font-size:11px}
.ctl output{text-align:right;font-variant-numeric:tabular-nums;font-size:11px}
input[type=range]{width:100%;accent-color:#8fc4ff;margin:0}
#randBtn{display:inline-flex;align-items:center;gap:7px;font-weight:600;padding-inline:14px;border-color:#b9dbff;color:#0a1422;background:linear-gradient(180deg,#bfe0ff,#7fb6f5);animation:rglow 3.2s ease-in-out infinite}
#randBtn:hover{background:linear-gradient(180deg,#d6ebff,#93c4fa)}
@keyframes rglow{0%,100%{box-shadow:0 0 10px rgba(143,196,255,.5),0 0 2px rgba(255,255,255,.4)}50%{box-shadow:0 0 22px 4px rgba(143,196,255,.95),0 0 46px 10px rgba(143,196,255,.45),0 0 6px rgba(255,255,255,.8)}}
#randBtn svg{animation:dspin 6s linear infinite}#randBtn.flash svg{animation:droll .7s cubic-bezier(.2,.8,.3,1)}
@keyframes dspin{to{transform:rotate(360deg)}}@keyframes droll{from{transform:rotate(0)}to{transform:rotate(720deg)}}
#randBtn.flash{animation:rflash .7s ease-out}
#saveSnap{display:inline-flex;align-items:center;justify-content:center;gap:7px;font-weight:600;color:#cfe6ff;border:1.5px solid #8fc4ff;background:rgba(143,196,255,.12);box-shadow:0 0 10px rgba(143,196,255,.25)}
#saveSnap:hover{background:rgba(143,196,255,.22);box-shadow:0 0 16px rgba(143,196,255,.5)}
#saveSnap.saved{animation:ssave .6s ease-out}
@keyframes ssave{0%{background:rgba(220,238,255,.75);color:#0a1422;box-shadow:0 0 28px rgba(220,238,255,.9)}100%{background:rgba(143,196,255,.12);box-shadow:0 0 10px rgba(143,196,255,.25)}}
.snap.new{animation:snew .5s ease-out}@keyframes snew{from{transform:scale(1.35);box-shadow:0 0 16px rgba(143,196,255,.9)}to{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){#saveSnap.saved,.snap.new{animation:none}}
@keyframes rflash{0%{box-shadow:0 0 44px rgba(220,238,255,1),0 0 10px #fff;background:#ffffff;transform:scale(1.06)}100%{box-shadow:0 0 8px rgba(143,196,255,.4);transform:scale(1)}}
@media (prefers-reduced-motion:reduce){#randBtn svg,#randBtn.flash svg{animation:none}#randBtn,#randBtn.flash{animation:none;box-shadow:0 0 12px rgba(143,196,255,.45)}}
.ctl.big{grid-template-columns:minmax(0,1fr) auto;row-gap:4px;padding-block:4px}
.ctl.big label{font-size:12px;color:var(--fg)}.ctl.big output{font-size:13px;color:var(--amber)}
.ctl.big input{grid-column:1/-1;grid-row:2;-webkit-appearance:none;appearance:none;height:24px;background:transparent;cursor:pointer}
.ctl.big input::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:linear-gradient(var(--amber),var(--amber)) 0 0/var(--p,50%) 100% no-repeat,rgba(255,255,255,.14)}
.ctl.big input::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--amber);margin-top:-7px;box-shadow:0 0 10px rgba(143,196,255,.55)}
.ctl.big input::-moz-range-track{height:6px;border-radius:3px;background:rgba(255,255,255,.14)}
.ctl.big input::-moz-range-progress{height:6px;border-radius:3px;background:var(--amber)}
.ctl.big input::-moz-range-thumb{width:20px;height:20px;border:none;border-radius:50%;background:var(--amber);box-shadow:0 0 10px rgba(143,196,255,.55)}
select{font:inherit;color:var(--fg);background:#16130f;border:1px solid var(--line);height:28px;border-radius:2px;padding:0 6px;width:100%}
.row{display:flex;gap:6px;flex-wrap:wrap}
.row button,.row .filebtn{flex:1 1 auto;justify-content:center}
.presets{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.presets button{justify-content:center;padding:0 6px}
.snaps{display:flex;flex-wrap:wrap;gap:6px}
.snap{display:inline-flex;border:1px solid var(--line);border-radius:2px;overflow:hidden}
.snap button{border:none;border-radius:0;height:28px;padding:0 10px}
.snap button.x{padding:0 7px;color:var(--dim);border-left:1px solid var(--line)}
.snap.on{border-color:var(--amber)}.snap.on button:first-child{color:var(--amber)}
.note{color:var(--dim);font-size:11px;line-height:1.5;margin:0}
.hint{position:fixed;left:max(16px,env(safe-area-inset-left,0px));bottom:max(14px,env(safe-area-inset-bottom,0px));color:var(--dim);font-size:11px;pointer-events:none}
body.hideui .top,body.hideui aside,body.hideui .hint{opacity:0;pointer-events:none}
body.hideui .top *,body.hideui aside *{pointer-events:none}
#showBtn{position:fixed;top:max(12px,env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));z-index:4;opacity:0;pointer-events:none;transition:opacity .3s;background:rgba(13,11,9,.5)}
body.hideui #showBtn{opacity:.35;pointer-events:auto}body.hideui #showBtn:hover,body.hideui #showBtn:focus-visible{opacity:1}
@media (max-width:640px){
  aside{top:auto;left:0;width:auto;height:52vh;border-left:none;border-top:1px solid var(--line);padding-top:14px;padding-left:max(16px,env(safe-area-inset-left,0px))}
  aside.closed{transform:translateY(105%)}
  .brand p,.hint{display:none}
}
@media (prefers-reduced-motion:reduce){aside{transition:none}}
</style>
</head>
<body>


<canvas id="c" aria-label="Flying through a curving translucent wormhole"></canvas>
<div class="top">
  <div class="brand"><h1>wormhole drive</h1></div>
  <div class="tools">
    <button id="pauseBtn" aria-label="Pause">Pause</button>
    <button id="randBtn"><svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><rect x="1.5" y="1.5" width="13" height="13" rx="3" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="5" cy="5" r="1.3" fill="currentColor"/><circle cx="11" cy="5" r="1.3" fill="currentColor"/><circle cx="8" cy="8" r="1.3" fill="currentColor"/><circle cx="5" cy="11" r="1.3" fill="currentColor"/><circle cx="11" cy="11" r="1.3" fill="currentColor"/></svg>Randomize</button>
    <button id="flareBtn" class="on" aria-pressed="true"><span class="lamp"></span>Flares</button>
    <button id="fsBtn">Fullscreen</button>
    <button id="hideBtn">Hide UI</button>
    <button id="panelBtn" aria-expanded="true" aria-controls="panel">Controls</button>
  </div>
</div>
<aside id="panel"></aside>
<button id="showBtn" aria-label="Show the interface">Show UI</button>
<div class="hint">Drag to look around · scroll to change the field of view · H hides the interface · R randomizes · S saves a snapshot</div>

<script>
const $=id=>document.getElementById(id),R=Math.random,pick=a=>a[(R()*a.length)|0];
const cv=$('c');
const gl=cv.getContext('webgl',{antialias:false,premultipliedAlpha:false});

const GROUPS=[
 ['Flight',[['speed','Speed',-2,8,.01,1.6],['fov','Field of view',.4,2.5,.01,1.1],['spin','Spin',-2,2,.01,0],['bank','Banking',0,2,.01,.8]]],
 ['Tunnel',[['curve','Curves',0,3,.01,1.2],['bends','Bendiness',.2,3,.01,1],['radius','Width',.6,4,.01,1.6],['ripple','Ripple',0,2,.01,.6],['branch','Branching',0,1,.01,.35]]],
 ['Walls',[['opac','Opacity',0,1,.01,.7],['refr','Refraction',0,1,.01,.5],['flow','Energy flow',0,4,.01,1.2],['fil','Filaments',1,14,1,6],['sharp','Sharpness',1,8,.1,3],['glow','Glow',0,2,.01,1]]],
 ['Space',[['dest','Destination',['Black hole','Wormhole sphere','Ringed star']],['space','Open space',0,1,.01,0],['stars','Stars',0,2,.01,1],['hold','Time out there',3,30,1,9]]],
 ['Gravity',[['mass','Mass',.4,3,.01,1],['disk','Disk glow',0,2,.01,1],['tilt','Disk tilt',-.6,.6,.01,.1],['dopp','Doppler',0,1,.01,.6],['dspin','Disk speed',0,3,.01,1]]],
 ['Color',[['pal','Palette',['Machine','Ember','Aurora','Threads','Mono']],['hue','Hue',0,360,1,0],['sat','Saturation',0,2,.01,1],['expo','Exposure',.3,3,.01,1.2],['chroma','Fringe',0,1,.01,.25],['inv','Invert',0,1,1,0]]],
 ['Lens flares',[['flare','Flares',0,3,.01,0],['glare','Glare',0,3,.01,0],['frush','Rush streaks',0,2,.01,1],['fstreak','Lens streak',0,2,.01,.5],['ghosts','Ghosts',0,.6,.005,.25],['ftrace','Filament glow',0,2,.01,.6],['fbeat','Beat flash',0,1,.01,0]]],
 ['Echo',[['echo','Trails',0,.97,.01,0],['ez','Trail pull',-.05,.05,.001,.012]]],
 ['Rhythm',[['bpm','BPM',60,180,1,112],['pulse','Pulse',0,1,.01,.2],['react','Audio drive',0,2,.01,1]]],
 ['Render',[['quality','Resolution',.3,1.5,.05,.8]]]
];
const P={},DEF={},CTL={};
const MT=v=>30*v*v*v,CY=v=>.02+119.98*v*v*v;
function disp(id,v,st){if(id==='mtime'){const e=document.getElementById('k_mtime');if(e)e.style.setProperty('--p',(v*100)+'%');}if(id==='cyc'){const t=CY(v);return t<.1?(t*1000).toFixed(0)+' ms':t<10?t.toFixed(2)+' s':t.toFixed(1)+' s';}if(id==='mtime'){const t=MT(v);return t<=0?'instant':t<10?t.toFixed(2)+' s':t.toFixed(1)+' s';}return fmt(v,st);}
function fmt(v,step){return step>=1?String(Math.round(v)):(+v).toFixed(step<.01?3:2);}
const panel=$('panel');
(function build(){
  const sn=document.createElement('div');sn.className='grp';sn.innerHTML='<h2>Snapshots</h2><div class="row"><button id="saveSnap"><svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M2 5.5h2.2L5.5 3.5h5l1.3 2H14v7.5H2z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><circle cx="8" cy="9" r="2.3" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>Save snapshot</button><button id="cycleBtn"><span class="lamp"></span>Cycle</button></div><div class="snaps" id="snaps"></div><div id="morphCtl"></div><p class="note" id="snapNote">Found a look you like? Save it. Click a snapshot to morph into it. Keys: S saves, 1–9 recall.</p>';panel.appendChild(sn);
  GROUPS.unshift(['Turbulence',[['turb','Turbulence',0,5,.01,0]]]);GROUPS.splice(1,0,['Morph',[['mtime','Morph time',0,1,.001,.464],['cyc','Cycle every',0,1,.001,.231]]]);
  for(const[g,list]of GROUPS){const d=document.createElement('div');d.className='grp';d.innerHTML='<h2>'+g+'</h2>';
    for(const c of list){const[id,lab]=c;const row=document.createElement('div');row.className='ctl';
      if(Array.isArray(c[2])){row.innerHTML='<label for="k_'+id+'">'+lab+'</label><select id="k_'+id+'">'+c[2].map((o,i)=>'<option value="'+i+'">'+o+'</option>').join('')+'</select><span></span>';
        d.appendChild(row);const el=row.querySelector('select');P[id]=0;DEF[id]=0;el.onchange=()=>{P[id]=+el.value;};CTL[id]={el,set:v=>{el.value=v;P[id]=+v;},raw:v=>{el.value=Math.round(v);P[id]=Math.round(v);}};}
      else{const[, ,mn,mx,st,df]=c;row.innerHTML='<label for="k_'+id+'">'+lab+'</label><input type="range" id="k_'+id+'" min="'+mn+'" max="'+mx+'" step="'+st+'" value="'+df+'"><output for="k_'+id+'">'+disp(id,df,st)+'</output>';
        d.appendChild(row);const el=row.querySelector('input'),out=row.querySelector('output');P[id]=df;DEF[id]=df;
        el.oninput=()=>{P[id]=+el.value;out.textContent=disp(id,P[id],st);if(id==='quality')resize();};
        CTL[id]={el,set:v=>{v=Math.max(mn,Math.min(mx,v));el.value=v;P[id]=+el.value;out.textContent=disp(id,P[id],st);},raw:v=>{v=Math.max(mn,Math.min(mx,v));P[id]=v;el.value=v;out.textContent=disp(id,v,st);}};}}
    if(g==='Tunnel')d.insertAdjacentHTML('beforeend','<div class="row"><button id="newBtn">New tunnel</button></div>');
    if(g==='Space')d.insertAdjacentHTML('beforeend','<div class="row"><button id="exitsBtn"><span class="lamp"></span>Auto exits</button></div><p class="note">Off by default. When on, every half minute the tunnel opens onto the destination, then pulls you back in. Set Open space to the maximum to stay out there.</p>');
    if(g==='Rhythm')d.insertAdjacentHTML('beforeend','<div class="row"><button id="beatBtn" class="on"><span class="lamp"></span>Beat</button><label class="filebtn"><input type="file" id="audioIn" accept="audio/*">Load a track</label><button id="stopAudio">Stop track</button></div><p class="note" id="audioNote">Load a song from your device: bass pushes you faster and shakes the pod, mids ripple the walls, highs brighten them.</p>');
    panel.appendChild(d);}
  const sg=$('saveSnap').closest('.grp');{const m=$('k_mtime');m.closest('.ctl').classList.add('big');m.style.setProperty('--p',(P.mtime*100)+'%');}panel.insertBefore($('k_turb').closest('.grp'),sg.nextSibling);
  const mg=$('k_mtime').closest('.grp'),mc=$('morphCtl');mc.style.cssText='display:flex;flex-direction:column;gap:inherit';mg.querySelectorAll('.ctl').forEach(c=>mc.appendChild(c));mg.remove();})();

function randomize(){{const b=$('randBtn');b.classList.remove('flash');void b.offsetWidth;b.classList.add('flash');}if(cycleOn){cycleOn=false;$('cycleBtn').classList.remove('on');}const rr=(a,b)=>a+R()*(b-a);const v={speed:rr(.5,5),fov:rr(.8,1.8),spin:R()<.7?0:rr(-.6,.6),bank:rr(0,1.5),curve:rr(.3,2.5),bends:rr(.4,2.2),radius:rr(1,3),ripple:rr(0,1.6),
  branch:rr(0,.9),opac:rr(.2,.95),refr:rr(0,1),flow:rr(.3,3),fil:(rr(2,13))|0,sharp:rr(1.5,7),glow:rr(.4,1.8),pal:(R()*5)|0,hue:R()<.6?0:rr(0,360),sat:rr(.7,1.5),expo:rr(.9,1.7),chroma:rr(0,.7),inv:R()<.1?1:0,echo:R()<.5?0:rr(.2,.8),ez:rr(-.02,.03)};
  Object.assign(v,{flare:R()<.3?0:.4+Math.pow(R(),.8)*2.2,frush:rr(0,2),fstreak:rr(0,1.5),ghosts:rr(0,.6),glare:R()<.45?0:rr(.2,2),ftrace:rr(0,1.5)});
  v.seed=R()*100;morphTo(v);}
const NOSNAP=['turb','fbeat','quality','bpm','react','pulse','mtime','cyc','space','hold'],SELS=['dest','pal'];
let morph=null,palFrom=null,palNow=null,snaps=[],snapOn=-1,cycleOn=false,cycleT=0;
function current(){const o={seed};for(const k in P)if(!NOSNAP.includes(k))o[k]=P[k];return o;}
function morphTo(t){const dur=MT(P.mtime);palFrom=palNow?palNow.map(c=>c.slice()):null;
  for(const k of SELS)if(k in t)CTL[k].set(t[k]);
  if(dur<=0){for(const k in t){if(k==='seed')seed=t.seed;else if(CTL[k]&&!SELS.includes(k))CTL[k].set(t[k]);}morph=null;palFrom=null;return;}
  morph={from:current(),to:t,t0:performance.now(),dur:dur*1000};}
const SLOWK={seed:2500,curve:1200,bends:1200,radius:900,branch:900};let blurBump=0;
function ease(k){k=Math.min(1,Math.max(0,k));const q=1-(1-k)*(1-k)*(1-k);return q*q*q*(q*(q*6-15)+10);}
function morphStep(now){blurBump=0;if(!morph)return 1;const el=Math.max(0,now-morph.t0);let k=Math.min(1,el/morph.dur);const e=ease(k);
  if(morph.dur<4000){const kk=Math.min(1,el/Math.max(morph.dur,600));blurBump=Math.sin(Math.PI*kk)*(1-morph.dur/4000);}
  let done=k>=1;
  for(const key in morph.to){if(SELS.includes(key))continue;const dk=Math.max(morph.dur,SLOWK[key]||0),ek=ease(el/dk);if(el<dk)done=false;const a=morph.from[key];let b=morph.to[key];if(key==='seed'){const T=6.2832;b=a+((((b-a)%T)+T*1.5)%T-T*.5);}if(a===undefined)continue;const v=a+(b-a)*ek;
    if(key==='seed')seed=v;else if(CTL[key])CTL[key].raw(v);}
  if(morph.dur<4000&&el<600)done=false;
  if(done){for(const key in morph.to)if(CTL[key]&&!SELS.includes(key))CTL[key].set(morph.to[key]);morph=null;}return e;}
function loadSnaps(){try{snaps=JSON.parse(localStorage.getItem('wormhole-snaps')||'[]')||[];}catch(_){snaps=[];}}
function storeSnaps(){try{localStorage.setItem('wormhole-snaps',JSON.stringify(snaps));}catch(_){}}
function drawSnaps(){const box=$('snaps');box.innerHTML='';snaps.forEach((s,i)=>{const d=document.createElement('div');d.className='snap'+(i===snapOn?' on':'');
  const b=document.createElement('button');b.textContent=String(i+1);b.setAttribute('aria-label','Morph to snapshot '+(i+1));b.onclick=()=>recall(i);
  const x=document.createElement('button');x.className='x';x.textContent='×';x.setAttribute('aria-label','Delete snapshot '+(i+1));x.onclick=()=>{snaps.splice(i,1);if(snapOn>=snaps.length)snapOn=-1;storeSnaps();drawSnaps();};
  d.append(b,x);box.appendChild(d);});}
function saveSnap(){snaps.push(current());snapOn=snaps.length-1;storeSnaps();drawSnaps();{const b=$('saveSnap');b.classList.remove('saved');void b.offsetWidth;b.classList.add('saved');const c=$('snaps').lastElementChild;if(c)c.classList.add('new');}$('snapNote').textContent='Saved snapshot '+snaps.length+'. Snapshots stay in this browser.';}
function recall(i){if(!snaps[i])return;snapOn=i;cycleT=0;const t={};for(const k in DEF)if(!NOSNAP.includes(k))t[k]=DEF[k];const sn={...t,...snaps[i]};for(const k of NOSNAP)delete sn[k];morphTo(sn);drawSnaps();}
const PALS=[[[.32,.58,1],[.86,.95,1],[1,.66,.28]],[[1,.32,.1],[1,.82,.45],[.65,.12,.45]],[[.2,1,.62],[.62,.42,1],[.9,1,1]],[[.5,1,.3],[.78,.64,1],[1,.6,.9]],[[.7,.72,.78],[1,1,1],[.55,.55,.6]]];

const VS='attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}';
const SCENE=`precision highp float;
uniform vec2 res,look,shake;
uniform float appr,dest,mass,disk,tilt,dopp,dspin,travel,clock,roll,fov,curve,bends,radius,ripple,branch,opac,refr,flow,fil,sharp,glow,space,stars,hue,sat,expo,inv,beat,hi,mid,bank,seed;
